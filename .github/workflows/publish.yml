# Publish @pocketshell/core to npm on a vX.Y.Z tag. The tag MUST equal the
# `version` in package.json (the release declaration — see README
# "Release flow"). Publishing uses the NPM_TOKEN repo secret (an npm granular
# access token with read/write on the @pocketshell packages — create it at
# npmjs.com → Access Tokens). If the publish job fails after the tag is
# pushed, fix the cause and re-run that job from the Actions tab; the re-run
# keeps the tag ref, so the tag does not need to move. A workflow_dispatch
# (or any non-tag ref) runs the build job only — nothing publishes without a
# tag, so this file can land before the npm secret exists.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm run test:unit
      - name: Verify the package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v$TAG package.json=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG != package.json version $VERSION — bump package.json (or re-tag) and push again"
            exit 1
          fi
      - run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@pocketshell/core
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish dist/pocketshell-core-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
