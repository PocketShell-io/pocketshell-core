name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: build, unit contracts, the browser policy contract, and the
  # dual-engine embed check. No Docker needed — this is the every-push floor.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm run test:unit
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - run: npm run test:browser
        env:
          CHROMIUM_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: npm run embed
      # The shared interface package (@pocketshell/ui) rides in this repo so
      # desktop, web and Android consume one UI source — same bargain as the
      # contract layer in src/. Gate it where it lives: its own pinned
      # toolchain, then build + typecheck against that.
      - name: Gate @pocketshell/ui
        working-directory: packages/ui
        run: |
          npm ci --no-fund --no-audit
          npm run build
          npm run typecheck

  # The Docker-backed tier: build the same fleet images the desktop and
  # Android projects build (tests-docker/ is a byte-identical copy of the
  # desktop fleet) and run core's client code against them through
  # testcontainers. ubuntu-latest ships Docker, so this runs on every push —
  # an integration tier that only ran pre-release would be a tier nobody
  # trusts. The helper image installs the real pocketshell + aplexer CLIs,
  # so the first build costs a few minutes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: bash scripts/build-docker.sh
      - run: npm run test:integration
